<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WWR Hint Tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="tracker-panel" aria-label="Map and hint notes">
        <header class="top-bar">
          <div>
            <h1>WWR Hint Tracker</h1>
            <p id="versionLabel">v0.1.0-dev</p>
          </div>
          <div class="top-actions">
            <span id="dataStatus">Loading data...</span>
            <button id="hideChromeButton" class="tool-button" type="button">Hide title/settings</button>
            <button id="resetRunButton" class="danger-button" type="button">Clear Run</button>
          </div>
        </header>

        <section class="settings-section" aria-label="Tracker settings">
          <label class="setting-control page-background-setting">
            <span>Page background</span>
            <input id="pageBackgroundInput" type="color" value="#f4f1e8">
          </label>
          <label class="setting-control stream-key-setting">
            <span>Stream key color</span>
            <input id="streamKeyInput" type="color" value="#00ff00">
          </label>
          <label class="setting-toggle stream-mode-setting">
            <input id="streamModeInput" type="checkbox">
            <span>Stream mode</span>
          </label>
          <label class="setting-toggle compact-mode-setting">
            <input id="compactModeInput" type="checkbox">
            <span>Compact mode</span>
          </label>
          <label class="setting-control map-icon-size-setting">
            <span>Item icon size</span>
            <input id="mapIconSizeInput" type="range" min="70" max="145" value="100">
          </label>
          <label class="setting-control hint-arrow-position-setting">
            <span>Hint arrow position</span>
            <input id="hintArrowPositionInput" type="range" min="28" max="72" value="50">
          </label>
          <div class="setting-control rando-folder-setting">
            <span>Link Rando Folder</span>
            <button id="browseRandoFolderButton" class="tool-button mini-button" type="button">Browse</button>
            <button id="syncRandoConfigButton" class="tool-button mini-button" type="button" disabled>Sync</button>
            <input id="randoFolderInput" type="file" webkitdirectory multiple hidden>
            <span id="randoFolderStatus" class="setting-status">Choose folder with randomizer .exe</span>
          </div>
          <label class="setting-toggle">
            <input id="showHoHoInput" type="checkbox" checked>
            <span>Show Old Man Ho Ho</span>
          </label>
          <label class="setting-toggle">
            <input id="showBlueChuInput" type="checkbox" checked>
            <span>Show Blue Chu Jelly</span>
          </label>
        </section>

        <button id="showChromeButton" class="tool-button show-chrome-button" type="button">Show title/settings</button>

        <div class="map-wrap">
          <div class="map-resize-help">Drag map edge to resize</div>
          <div class="map-main-row">
            <div id="shardPreview" class="shard-preview" hidden>
              <img id="shardPreviewImage" alt="">
            </div>
            <div id="itemPalette" class="item-palette" aria-label="Item hint palette" hidden></div>
            <div id="mapResizeFrame" class="map-resize-frame">
              <div id="seaGrid" class="sea-grid" aria-label="7 by 7 sea chart"></div>
              <div class="map-resize-handle top" data-resize-edge="top"></div>
              <div class="map-resize-handle right" data-resize-edge="right"></div>
              <div class="map-resize-handle bottom" data-resize-edge="bottom"></div>
              <div class="map-resize-handle left" data-resize-edge="left"></div>
              <div class="map-resize-handle corner top-left" data-resize-edge="top-left"></div>
              <div class="map-resize-handle corner top-right" data-resize-edge="top-right"></div>
              <div class="map-resize-handle corner bottom-right" data-resize-edge="bottom-right"></div>
              <div class="map-resize-handle corner bottom-left" data-resize-edge="bottom-left"></div>
            </div>
            <aside id="mapSideTab" class="map-side-tab" aria-label="Jelly and Triforce shard tracker">
              <div class="jelly-counter">
                <img src="assets/images/items/Blue%20Chu%20Jelly.png" alt="">
                <span>x</span>
                <strong id="blueChuCount">0</strong>
              </div>
              <div id="shardStatusList" class="shard-status-list"></div>
            </aside>
          </div>
          <div id="areaStrip" class="area-strip" aria-label="Off-map and dungeon areas"></div>
        </div>

        <section class="notes-section">
          <div class="section-heading">
            <h2>Hint Notes</h2>
            <span id="saveStatus">Saved locally</span>
          </div>
          <textarea
            id="hintInput"
            spellcheck="false"
            aria-label="Hint notes"
            placeholder="Type hints here, one per line.&#10;&#10;Examples:&#10;dragon roost to gohma&#10;hookshot at needle rock&#10;progressive sword in dragon roost cavern boss"
          ></textarea>
        </section>
      </section>

      <aside class="hint-panel" aria-label="Parsed hint overview">
        <div id="hintPanelResizeHandle" class="hint-panel-resize-handle" aria-hidden="true"></div>
        <section class="parsed-section">
          <div class="section-heading">
            <h2>Parsed Hints</h2>
            <div class="parsed-actions">
              <button id="undoButton" class="tool-button" type="button">Undo</button>
              <button id="redoButton" class="tool-button" type="button">Redo</button>
              <span id="hintCount">0 hints</span>
            </div>
          </div>
          <div class="tabs" role="tablist" aria-label="Hint type filters">
            <button class="tab active" type="button" data-filter="all">All</button>
            <button class="tab" type="button" data-filter="path">Path</button>
            <button class="tab" type="button" data-filter="item">Items</button>
            <button class="tab" type="button" data-filter="location">Locations</button>
            <button class="tab" type="button" data-filter="needs-review">Review</button>
          </div>
          <div id="hintList" class="hint-list" aria-live="polite"></div>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
